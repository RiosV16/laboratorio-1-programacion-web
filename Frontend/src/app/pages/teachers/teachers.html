<section class="page">
  <h1>Listado de profesores</h1>

  <button type="button" (click)="loadTeachers()">
    Actualizar profesores
  </button>

  @if (loading) {
    <p>Cargando profesores...</p>
  } @else if (error) {
    <p>{{ error }}</p>
  } @else {
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Especialidad</th>
        </tr>
      </thead>

      <tbody>
        @for (teacher of teachers; track teacher.id) {
          <tr>
            <td>{{ teacher.id }}</td>
            <td>{{ teacher.nombre }}</td>
            <td>{{ teacher.correo }}</td>
            <td>{{ teacher.especialidad }}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</section>
